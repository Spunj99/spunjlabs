<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RVGD | SpunjLabs</title>
<meta name="description" content="Retro Video Games Day scoreboard.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RVGD">
<link rel="manifest" href="rvgd-app/manifest.webmanifest">
<link rel="icon" href="rvgd-app/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="rvgd-app/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="rvgd-app/app.css">
<script type="module" src="rvgd-app/app.js"></script>
</head>
<body>
<div class="crt" aria-hidden="true"></div>

<header class="bar">
  <a class="bar-btn" id="homeBtn" href="rvgd" aria-label="All tournaments" hidden></a>
  <div class="bar-title" id="barTitle">
    <span class="t1">RVGD</span>
  </div>
  <button class="bar-btn" id="wheelBtn" type="button" aria-label="1v1 draw wheel" hidden></button>
  <button class="bar-btn" id="galleryBtn" type="button" aria-label="Photo gallery" hidden></button>
  <button class="bar-btn" id="statsBtn" type="button" aria-label="Stats" hidden></button>
  <button class="bar-btn" id="lockBtn" type="button" aria-label="Unlock scoring" hidden></button>
  <button class="trophy-tab" id="standingsBtn" type="button" aria-label="Standings" hidden></button>
</header>

<main id="view" class="view"><p class="loading">LOADING<span class="blink">_</span></p></main>

<button class="add-btn" id="addBtn" type="button" hidden><span>+</span> ADD GAME</button>

<!-- Add / edit game -->
<dialog class="sheet" id="gameSheet" aria-labelledby="gameSheetTitle">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="gameSheetTitle">SELECT GAME</h2>
      <button class="x" type="button" data-close aria-label="Close">&times;</button>
    </div>
    <section class="step" id="stepSearch">
      <label class="search">
        <span class="prompt" aria-hidden="true">&#9654;</span>
        <input id="searchInput" type="search" placeholder="TYPE TO SEARCH" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search games">
      </label>
      <ul class="results" id="results" role="listbox" aria-label="Games"></ul>
      <p class="credit">Game art from <a href="https://en.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a></p>
    </section>
    <section class="step" id="stepPlace" hidden>
      <div class="picked" id="picked"></div>
      <div class="place-opts">
        <label class="toggle"><input id="teamToggle" type="checkbox"><span class="sw" aria-hidden="true"></span> TEAM GAME</label>
        <button class="reset" id="resetBtn" type="button">&#8634; RESET</button>
      </div>
      <ol class="slots" id="slots"></ol>
      <p class="ask" id="ask"></p>
      <div class="pads" id="pads"></div>
      <div class="sheet-actions">
        <button class="btn danger" id="deleteBtn" type="button" hidden>DELETE</button>
        <button class="btn primary" id="saveBtn" type="button" disabled>SAVE &#9654;</button>
      </div>
    </section>
  </div>
</dialog>

<!-- Standings -->
<dialog class="sheet" id="standingsSheet" aria-labelledby="standingsTitle">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="standingsTitle">STANDINGS</h2>
      <button class="x" type="button" data-close aria-label="Close">&times;</button>
    </div>
    <div id="standingsBody"></div>
    <div class="sheet-actions">
      <button class="btn" id="adminBtn" type="button">SETTINGS</button>
      <button class="btn primary" id="copyBtn" type="button">COPY AS TEXT</button>
    </div>
  </div>
</dialog>

<!-- Stats -->
<dialog class="sheet" id="statsSheet" aria-labelledby="statsTitle">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="statsTitle">STATS</h2>
      <button class="x" type="button" data-close aria-label="Close">&times;</button>
    </div>
    <div id="statsBody"></div>
  </div>
</dialog>

<!-- Wheel: random 1v1 draw -->
<dialog class="sheet" id="wheelSheet" aria-labelledby="wheelTitle">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="wheelTitle">1V1 DRAW</h2>
      <button class="x" type="button" data-close aria-label="Close">&times;</button>
    </div>
    <div class="wheel-wrap">
      <span class="wheel-ptr" aria-hidden="true"></span>
      <svg id="wheel" viewBox="-106 -106 212 212" role="img" aria-label="Wheel of players"><g id="wheelRot"></g><circle class="wheel-hub" r="13"/></svg>
    </div>
    <p class="wheel-pick" id="wheelPick" aria-live="polite"></p>
    <ol class="draw" id="wheelDraw"></ol>
    <div class="sheet-actions">
      <button class="btn" id="wheelReset" type="button">&#8634; RESET</button>
      <button class="btn primary" id="wheelSpin" type="button">SPIN &#9654;</button>
    </div>
  </div>
</dialog>

<!-- Photo gallery: paged grid of thumbnails -->
<dialog class="sheet" id="gallerySheet" aria-labelledby="galleryTitle">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="galleryTitle">GALLERY</h2>
      <button class="x" type="button" data-close aria-label="Close">&times;</button>
    </div>
    <div class="gpages" id="gPages"></div>
    <div class="gnav" id="gNav">
      <button class="garr" id="gPrev" type="button" aria-label="Previous page">&#9664;</button>
      <span id="gCount"></span>
      <button class="garr" id="gNext" type="button" aria-label="Next page">&#9654;</button>
    </div>
  </div>
</dialog>

<!-- Full-screen photo viewer -->
<dialog class="viewer" id="viewer" aria-label="Photo">
  <div class="vstrip" id="vStrip"></div>
  <span class="vcount" id="vCount"></span>
  <button class="x vx" id="vClose" type="button" aria-label="Close">&times;</button>
  <button class="varr prev" id="vPrev" type="button" aria-label="Previous photo">&#9664;</button>
  <button class="varr next" id="vNext" type="button" aria-label="Next photo">&#9654;</button>
</dialog>

<!-- PIN -->
<dialog class="sheet small" id="pinSheet" aria-labelledby="pinTitle">
  <form class="sheet-in" id="pinForm" method="dialog">
    <div class="sheet-head">
      <h2 id="pinTitle">INSERT PIN</h2>
      <button class="x" type="button" data-close aria-label="Close">&times;</button>
    </div>
    <p class="hint" id="pinHint">Enter the tournament PIN to start scoring on this device.</p>
    <input class="pin" id="pinInput" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" required>
    <p class="err" id="pinErr" role="alert"></p>
    <div class="sheet-actions">
      <button class="btn primary" type="submit">CONTINUE &#9654;</button>
    </div>
  </form>
</dialog>

<!-- Tournament settings (admin) -->
<dialog class="sheet" id="adminSheet" aria-labelledby="adminTitle">
  <form class="sheet-in" id="adminForm">
    <div class="sheet-head">
      <h2 id="adminTitle">TOURNAMENT</h2>
      <button class="x" type="button" data-close aria-label="Close">&times;</button>
    </div>
    <div class="form">
      <label>NUMBER <input name="number" type="number" min="1" max="999" inputmode="numeric" placeholder="Blank for an exhibition"></label>
      <label>SUBTITLE <input name="subtitle" type="text" maxlength="40" placeholder="A New Dawn"></label>
      <label>DATE <input name="date" type="date"></label>
      <fieldset>
        <legend>PLAYERS</legend>
        <div class="grid2">
          <input name="p1" type="text" maxlength="12" placeholder="Player 1" aria-label="Player 1" required>
          <input name="p2" type="text" maxlength="12" placeholder="Player 2" aria-label="Player 2" required>
          <input name="p3" type="text" maxlength="12" placeholder="Player 3" aria-label="Player 3" required>
          <input name="p4" type="text" maxlength="12" placeholder="Player 4" aria-label="Player 4" required>
        </div>
      </fieldset>
      <fieldset>
        <legend>POINTS 1ST&ndash;4TH</legend>
        <div class="grid4">
          <input name="s1" type="number" inputmode="numeric" aria-label="Points for 1st" required>
          <input name="s2" type="number" inputmode="numeric" aria-label="Points for 2nd" required>
          <input name="s3" type="number" inputmode="numeric" aria-label="Points for 3rd" required>
          <input name="s4" type="number" inputmode="numeric" aria-label="Points for 4th" required>
        </div>
      </fieldset>
      <label class="toggle"><input name="wackChip" type="checkbox"><span class="sw" aria-hidden="true"></span> WACK CHIP</label>
      <label class="toggle"><input name="lowWins" type="checkbox"><span class="sw" aria-hidden="true"></span> LOWEST TOTAL WINS</label>
      <label>SCORING PIN <input name="pin" type="text" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="Leave blank to keep"></label>
      <label class="toggle"><input name="exhibition" type="checkbox"><span class="sw" aria-hidden="true"></span> EXHIBITION (NOT IN ALL-TIME STATS)</label>
      <label class="toggle"><input name="complete" type="checkbox"><span class="sw" aria-hidden="true"></span> COMPLETE (LOCK)</label>
    </div>
    <p class="err" id="adminErr" role="alert"></p>
    <div class="sheet-actions">
      <button class="btn primary" type="submit">SAVE &#9654;</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
